.kpis{display:flex;gap:8px;margin:10px 0}

.kpi .v{font-size:22px;font-weight:700}.kpi .l{font-size:12px;color:var(--ink2)}
.kpi.good .v{color:var(--good)}.kpi.crit .v{color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}

.chip.on{outline:2px solid var(--ink);outline-offset:-1px;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}

details.card>summary::-webkit-details-marker{display:none}
summary .tname{font-weight:600}summary .cnt{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.cnt.ok{color:var(--good);font-weight:600}.cnt.gap{color:var(--crit);font-weight:600}
.cardbody{padding:0 12px 12px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill{border-radius:999px;padding:2px 10px;font-size:12.5px;border:1px solid var(--border)}
.pill.cap{background:color-mix(in srgb,var(--warnc) 14%,var(--surface))}
.warn{color:var(--warnc);font-size:12.5px;font-weight:600}
ul.tasks{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--grid)}
ul.tasks li{padding:6px 0;border-bottom:1px solid var(--grid);font-size:13px;color:var(--ink2)}
.trow{display:flex;gap:8px;align-items:baseline}
.time{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:12.5px;flex:0 0 96px}
.qty{background:color-mix(in srgb,var(--ink) 8%,var(--surface));border-radius:6px;
padding:0 6px;font-size:11.5px;font-weight:700;flex:none}
.assg{font-size:12px;color:var(--good);margin-left:104px}
.duty{cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.duty.open{-webkit-line-clamp:unset}
.tl .assg{margin-left:0}.tl .team{font-size:12px;color:var(--ink2);white-space:nowrap;
display:inline-flex;align-items:center;gap:5px;flex:none}
footer{margin-top:24px;font-size:12px;color:var(--mut)}

const COLORS = {LABOR:1,INFO:1,RUNNER:1,MARSHALL:1,ASSIST:1,PARKING:1,KIDS:1,ROTC:1};
const cvar = c => `var(--c-${COLORS[c] ? c.toLowerCase() : 'x'})`;
const esc = s => String(s??"").replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
// English display names by team_code (Sheet data may be bilingual/Chinese)
const EN_TEAM = {LABOR:"Labor Team (A)",INFO:"Info Team (B)",RUNNER:"Runner Team (C)",
  MARSHALL:"Dock Marshall Team (D)",ASSIST:"Assistance Team (E)",PARKING:"Parking Team (F)",
  KIDS:"Kids Zone",ROTC:"ROTC Dock Pushers",POST:"Post-Event Wrap-up",
  PHOTO:"Photo / Records",EVWEEK:"Event Week (Pre-Festival)"};
// English fallback for known Chinese notes/source_org strings from the Sheet
const EN_TXT = {
  "搭建/标牌/巡查/补水，全天接力":"Setup / signage / patrol / water refills, relay all day",
  "手环免责/签到台/信息台/演出协调/替补桨手帐篷":"Wristbands & waivers / check-in / info table / performance coordination / sub-paddler tent",
  "成绩传递/集队引导":"Results runners / team staging guides",
  "码头总管/主副 Lane Marshall":"Dock chief / lead & assistant lane marshalls",
  "Pre-Lane 排队×3 + 救生衣管理":"Pre-lane queuing ×3 + life jacket management",
  "停车引导×2":"Parking guides ×2",
  "主管+4手工桌 ⚠️ 待确认给 Modern School":"Lead + 4 craft tables ⚠️ pending confirmation with Modern School",
  "Dock Pusher×13，Mark 跟进中":"Dock pushers ×13, Mark following up",
  "4-5 人，不设独立名额":"4–5 people, staffed from other teams (no separate quota)",
  "颁奖记录":"Awards ceremony records",
  "2025=Signature 人员(MacKenzie/Beth/Hayden/Sharla)，2026 需重新指派":"2025 = Signature staff (MacKenzie/Beth/Hayden/Sharla); 2026 needs reassignment",
  "从各组留守":"Staffed from other teams",
  "⚠️ 2026 无人":"⚠️ Unassigned for 2026"};
const tr = s => EN_TXT[s] ?? s;
const tname = t => EN_TEAM[t.team_code] || t.team_name;
const PHASES = [["event_day","Event Day"],["post_event","Post-Event"],["event_week","Event Week ⚠️ unclaimed"]];
let data = SNAPSHOT, source = "embedded snapshot";
let filter = localStorage.getItem("vol_team") || "ALL";
const openSet = new Set(JSON.parse(localStorage.getItem("vol_open") || "[]"));

function extractAssignees(str){
  // Positions.assignees is free text captains fill directly — not required to match Roster.
  // Split on common separators; a bare number (e.g. "10") means a headcount with no name given.
  if(!str) return {names:[], headcount:0};
  const parts = str.replace(/\([^)]*\)/g,"").split(/[,&\/]|\band\b|、/i).map(s=>s.trim()).filter(Boolean);
  const names = []; let headcount = 0;
  parts.forEach(p => /^\d+$/.test(p) ? headcount += +p : names.push(p));
  return {names, headcount};
}
function counts(t){
  // filled = union of Roster rows + names typed into Positions.assignees for this team (case-insensitive dedupe).
  const seen = new Map();
  data.roster.filter(r => r.team_code===t.team_code && r.status!=="退出")
    .forEach(r => seen.set(r.name.toLowerCase(), {name: r.name, is_captain: r.is_captain}));
  let headcount = 0;
  data.positions.filter(p => p.team_code===t.team_code).forEach(p => {
    const {names, headcount: hc} = extractAssignees(p.assignees);
    headcount += hc;
    names.forEach(n => { const k=n.toLowerCase(); if(!seen.has(k)) seen.set(k, {name:n, is_captain:""}); });
  });
  const members = [...seen.values()];
  return {filled: members.length + headcount, target: +t.target||0, members, headcount};
}
function render(){
  const teams = data.teams;
  // KPI（POST 不设独立名额，不计目标）
  const core = teams.filter(t => t.team_code!=="POST");
  const coreCounts = core.map(counts);
  const target = core.reduce((s,t)=>s+(+t.target||0),0);
  const filled = coreCounts.reduce((s,c)=>s+c.filled,0);
  const gap = Math.max(0, target-filled);
  document.getElementById("kpis").innerHTML =
    `<div class="kpi"><div class="v">${target}</div><div class="l">Target (minimum — more welcome)</div></div>`+
    `<div class="kpi good"><div class="v">${filled}</div><div class="l">Signed up</div></div>`+
    `<div class="kpi ${gap?"crit":"good"}"><div class="v">${gap||"✓"}</div><div class="l">${gap?"Still needed ⚠️":"Target met"}</div></div>`;
  // 筛选 chips
  document.getElementById("chips").innerHTML =
    `<button class="chip ${filter==="ALL"?"on":""}" data-t="ALL">All</button>` +
    teams.map(t=>`<button class="chip ${filter===t.team_code?"on":""}" data-t="${t.team_code}">`+
      `<span class="dot" style="background:${cvar(t.team_code)}"></span>${esc(tname(t))}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    filter=b.dataset.t; localStorage.setItem("vol_team",filter); render();});
  // 组卡片
  const show = teams.filter(t=>filter==="ALL"||t.team_code===filter);
  document.getElementById("cards").innerHTML = show.map(t=>{
    const {filled,target,members,headcount}=counts(t);
    const tasks = data.positions.filter(p=>p.team_code===t.team_code);
    const capName = t.captain || members.find(m=>m.is_captain==="Y")?.name || "";
    const cls = t.team_code==="POST" ? "" : (filled>=target?"ok":"gap");
    const unlisted = headcount ? `<span class="pill mut">+${headcount} unlisted</span>` : "";
    const pills = members.length || headcount
      ? members.map(m=>`<span class="pill ${m.is_captain==="Y"?"cap":""}">${m.is_captain==="Y"?"👑 ":""}${esc(m.name)}</span>`).join("") + unlisted
      : `<span class="mut small">No sign-ups yet</span>`;
    const rows = tasks.map(p=>
      `<li><div class="trow"><span class="time">${esc(p.shift_raw||"—")}</span>`+
      (+p.qty>1?`<span class="qty">×${p.qty}</span>`:"")+(p.walkie?"📻":"")+
      `<span class="duty" onclick="this.classList.toggle('open')">${esc(p.duty)}</span></div>`+
      (p.assignees?`<div class="assg">👤 ${esc(p.assignees)}</div>`:"")+`</li>`).join("");
    const open = filter!=="ALL" || openSet.has(t.team_code) ? " open" : "";
    return `<details class="card" data-t="${t.team_code}" style="border-left-color:${cvar(t.team_code)}"${open}>`+
      `<summary><span class="dot" style="background:${cvar(t.team_code)}"></span>`+
      `<span class="tname">${esc(tname(t))}</span>`+
      (capName?`<span class="small mut">👑 ${esc(capName)}</span>`:`<span class="warn">Captain TBD</span>`)+
      (t.team_code==="POST"?`<span class="cnt">${esc(tr(t.notes))}</span>`
        :`<span class="cnt ${cls}">${filled}/${target}${filled>=target?" ✓":""}</span>`)+
      `</summary><div class="cardbody">`+
      `<div class="mut small">${esc(tr(t.source_org))}${t.notes&&t.team_code!=="POST"?" · "+esc(tr(t.notes)):""}</div>`+
      (t.team_code==="POST"?"":`<div class="pills">${pills}</div>`)+
      (rows?`<ul class="tasks">${rows}</ul>`:"")+`</div></details>`;
  }).join("");
  document.querySelectorAll("details.card").forEach(d=>d.addEventListener("toggle",()=>{
    if(filter!=="ALL")return;
    d.open?openSet.add(d.dataset.t):openSet.delete(d.dataset.t);
    localStorage.setItem("vol_open",JSON.stringify([...openSet]));}));
  // 时间线（按 phase 分三段，各自折叠；跟随组筛选）
  document.getElementById("timeline").innerHTML = PHASES.map(([ph,label])=>{
    let ps = data.positions.filter(p=>p.phase===ph&&(filter==="ALL"||p.team_code===filter));
    ps.sort((a,b)=>(a.start||"99").localeCompare(b.start||"99"));
    if(!ps.length) return "";
    const tmap = Object.fromEntries(data.teams.map(t=>[t.team_code,tname(t)]));
    const rows = ps.map(p=>
      `<li><div class="trow"><span class="time">${esc(p.shift_raw||"—")}</span>`+
      (+p.qty>1?`<span class="qty">×${p.qty}</span>`:"")+
      `<span class="team"><span class="dot" style="background:${cvar(p.team_code)}"></span>`+
      `${esc((tmap[p.team_code]||"—").split(" ")[0])}</span></div>`+
      `<div class="trow"><span class="time"></span><span class="duty" onclick="this.classList.toggle('open')">${esc(p.duty)}</span></div>`+
      (p.assignees?`<div class="trow"><span class="time"></span><span class="assg tl">👤 ${esc(p.assignees)}</span></div>`:"")+`</li>`).join("");
    return `<details class="card tl"><summary><span class="tname">${label}</span>`+
      `<span class="cnt">${ps.length} tasks</span></summary>`+
      `<div class="cardbody"><ul class="tasks">${rows}</ul></div></details>`;
  }).join("");
  document.getElementById("status").innerHTML =
    `Data: ${esc(data.generated||"?")} · ${source}`+
    (DATA_URL?`<button onclick="load(true)">Refresh</button>`:"");
}
async function load(force){
  const cached = localStorage.getItem("vol_cache");
  if(cached && !force){ try{ data=JSON.parse(cached); source="cached"; render(); }catch(e){} }
  if(!DATA_URL) { render(); return; }
  try{
    const r = await fetch(DATA_URL, {redirect:"follow"});
    const j = await r.json();
    if(j && j.teams){ data=j; source="live"; localStorage.setItem("vol_cache", JSON.stringify(j)); }
  }catch(e){ source += " (connection failed)"; }
  render();
}
render(); load();
