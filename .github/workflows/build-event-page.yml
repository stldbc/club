name: Build event sign-up page

# Triggered from the Events tab in the Google Sheet (Apps Script "发布页面" button),
# which POSTs a repository_dispatch with type "build-event-page" and the row's data
# as client_payload. See Captain Session 2026/apps_script.gs in the main STLDBF workspace.
on:
  repository_dispatch:
    types: [build-event-page]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Event fields live under client_payload.data (not top-level) because GitHub's
      # repository_dispatch endpoint rejects more than 10 top-level client_payload properties.
      - name: Generate page
        env:
          EVENT_ID: ${{ github.event.client_payload.event_id }}
          CAPACITY: ${{ github.event.client_payload.data.capacity }}
          LABEL: ${{ github.event.client_payload.data.label }}
          EVENT_DATE: ${{ github.event.client_payload.data.event_date }}
          ARRIVE_TIME: ${{ github.event.client_payload.data.arrive_time }}
          ON_WATER_TIME: ${{ github.event.client_payload.data.on_water_time }}
          LOCATION: ${{ github.event.client_payload.data.location }}
          TSHIRT_SIZES: ${{ github.event.client_payload.data.tshirt_sizes }}
          NOTES: ${{ github.event.client_payload.data.notes }}
          CANCELLED: ${{ github.event.client_payload.data.cancelled }}
          CANCEL_NOTE: ${{ github.event.client_payload.data.cancel_note }}
          APPS_SCRIPT_URL: ${{ github.event.client_payload.apps_script_url }}
        run: python3 scripts/build_event_page.py

      # A brand-new event page (untracked in git) also gets announced on announcements.html.
      # Publishing a change to an *existing* page (capacity/time tweak etc.) does not re-announce it
      # UNLESS it's being marked cancelled — a cancellation always re-syncs the announcement card.
      - name: Check if this is a new page
        id: pagecheck
        run: |
          FILE="${{ github.event.client_payload.event_id }}.html"
          if git status --porcelain -- "$FILE" | grep -q '^??'; then
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add/update announcements (new pages, or any cancellation)
        if: steps.pagecheck.outputs.is_new == 'true' || github.event.client_payload.data.cancelled == 'true'
        env:
          EVENT_ID: ${{ github.event.client_payload.event_id }}
          LABEL: ${{ github.event.client_payload.data.label }}
          EVENT_DATE: ${{ github.event.client_payload.data.event_date }}
          ARRIVE_TIME: ${{ github.event.client_payload.data.arrive_time }}
          ON_WATER_TIME: ${{ github.event.client_payload.data.on_water_time }}
          LOCATION: ${{ github.event.client_payload.data.location }}
          CAPACITY: ${{ github.event.client_payload.data.capacity }}
          CANCELLED: ${{ github.event.client_payload.data.cancelled }}
          CANCEL_NOTE: ${{ github.event.client_payload.data.cancel_note }}
        run: python3 scripts/update_announcements.py

      - name: Commit and push
        run: |
          git config user.name "STLDBF Sign-up Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "*.html"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-build event page: ${{ github.event.client_payload.event_id }}"
            git push
          fi
